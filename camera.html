<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera da Babá (Inteligência Ativa)</title>
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; background-color: #000000; background-image: radial-gradient(circle at 50% 0%, #1a1a1c 0%, #000000 80%); color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; max-width: 640px; width: 100%; box-sizing: border-box; position: relative; }
        h2 { font-weight: 600; font-size: 20px; margin: 0 0 20px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        video#video-local { width: 100%; border-radius: 16px; background: #0a0a0a; margin-bottom: 20px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
        .status-badge { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .seguro .dot { background: #32d74b; box-shadow: 0 0 10px #32d74b; }
        .alerta { background: rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.3); color: #ff453a; }
        .alerta .dot { background: #ff453a; box-shadow: 0 0 10px #ff453a; animation: pulse 1s infinite; }
        .ia-loading { color: #0a84ff; border-color: rgba(10, 132, 255, 0.3); background: rgba(10, 132, 255, 0.1); }
        .ia-loading .dot { background: #0a84ff; }
        #canvas-ia { position: absolute; top: 72px; left: 24px; width: calc(100% - 48px); height: auto; z-index: 10; pointer-events: none; border-radius: 16px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="interface-camera" class="glass-panel">
        <h2><span id="label-ambiente">Iniciando...</span></h2>
        <video id="video-local" autoplay playsinline muted></video>
        <canvas id="canvas-ia"></canvas>
        <div id="status-visual" class="status-badge ia-loading">
            <div class="dot"></div> <span id="status-texto">CARREGANDO IA NEURAL...</span>
        </div>
    </div>

    <script>
        // Chave compartilhada dos dispositivos de câmera. Precisa ser IGUAL
        // ao valor configurado na variável de ambiente CHAVE_DISPOSITIVOS
        // do servidor. Troque o valor abaixo antes de usar em produção.
        const CHAVE_DISPOSITIVO = "troque-esta-chave-de-dispositivo";

        // Tópico do ntfy.sh usado para notificações push. Tópicos do ntfy.sh
        // são públicos por padrão — qualquer pessoa que souber esse nome
        // pode se inscrever e ver os alertas. Troque por um valor longo e
        // aleatório (pode usar o mesmo tipo de sequência da CHAVE_DISPOSITIVO).
        const NTFY_TOPICO = "troque-para-um-topico-aleatorio";

        let nomeDaCamera = localStorage.getItem('camBabaID');
        if (!nomeDaCamera) {
            nomeDaCamera = "Webcam " + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('camBabaID', nomeDaCamera);
        }

        const videoElem = document.getElementById('video-local');
        const canvasIA = document.getElementById('canvas-ia');
        const ctxIA = canvasIA.getContext('2d');
        const statusVisual = document.getElementById('status-visual');
        const statusTexto = document.getElementById('status-texto');
        
        const canvasStream = document.createElement('canvas');
        const ctxStream = canvasStream.getContext('2d');
        canvasStream.width = 640;
        canvasStream.height = 360;

        let ws;
        let gravador;
        let pedacosVideo = [];
        let gravando = false;
        let tempoUltimoMovimento = 0;
        let modeloIA = null;
        let loopTransmissao; 
        let streamAtual = null;
        const alvos = ['person', 'dog', 'cat'];

        // ===== Detecção de som (choro, latido, miado, grito) =====
        let modeloAudio = null;
        let audioCtx, audioSource, audioProcessor;
        let bufferAudioAcumulado = [];
        let ultimaAnaliseAudio = 0;
        let indicesCategorias = {};
        const INTERVALO_ANALISE_AUDIO_MS = 1000; // roda a IA de áudio a cada 1s
        const LIMIAR_CLASSE_AUDIO = 0.3;          // confiança mínima pra aceitar um som específico
        const LIMIAR_SOM_ALTO = 0.18;             // volume (RMS) considerado "som alto" quando não reconhecido

        const CATEGORIAS_AUDIO = [
            { chave: 'CHORO_BEBE', label: 'Choro de bebê', termos: ['baby cry', 'infant cry', 'crying, sobbing'], tag: 'baby' },
            { chave: 'LATIDO',     label: 'Latido de cachorro', termos: ['bark', 'dog'], tag: 'dog' },
            { chave: 'MIADO',      label: 'Miado de gato', termos: ['meow', 'cat'], tag: 'cat' },
            { chave: 'GRITO',      label: 'Grito', termos: ['scream', 'shout', 'yell'], tag: 'scream' },
        ];

        window.onload = () => {
            document.getElementById('label-ambiente').innerText = nomeDaCamera;
            conectarWebsocket();
            iniciarCameraLocal();
        };

        function atualizarStatus(tipo, mensagem) {
            statusVisual.className = "status-badge " + tipo;
            statusTexto.innerText = mensagem;
        }

        async function carregarInteligencia() {
            try {
                modeloIA = await cocoSsd.load();
                atualizarStatus("seguro", "SISTEMA ONLINE E VIGIANDO");
                processarVisaoComputacional();
            } catch (e) {
                atualizarStatus("alerta", "FALHA AO CARREGAR IA");
            }
        }

        // ===== IA de áudio: carrega o modelo e a lista de classes de som =====
        async function carregarInteligenciaAudio() {
            try {
                modeloAudio = await tf.loadGraphModel('https://tfhub.dev/google/tfjs-model/yamnet/tfjs/1', { fromTFHub: true });

                const respostaCsv = await fetch('https://raw.githubusercontent.com/tensorflow/models/master/research/audioset/yamnet/yamnet_class_map.csv');
                const textoCsv = await respostaCsv.text();
                const nomesClasseAudio = textoCsv.trim().split('\n').slice(1).map(linha => {
                    const partes = linha.split(',');
                    return partes.slice(2).join(',').replace(/"/g, '').trim();
                });

                CATEGORIAS_AUDIO.forEach(categoria => {
                    const indiceEncontrado = nomesClasseAudio.findIndex(nome =>
                        categoria.termos.some(termo => nome.toLowerCase().includes(termo))
                    );
                    indicesCategorias[categoria.chave] = indiceEncontrado;
                });

                iniciarEscutaDeAudio();
            } catch (e) {
                console.log('Não foi possível carregar a IA de áudio:', e);
            }
        }

        // Liga o microfone num "canal silencioso" (não toca nada, só analisa)
        function iniciarEscutaDeAudio() {
            if (!streamAtual) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaStreamSource(streamAtual);
            audioProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

            const nodoSilencioso = audioCtx.createGain();
            nodoSilencioso.gain.value = 0; // impede o eco do próprio áudio

            audioSource.connect(audioProcessor);
            audioProcessor.connect(nodoSilencioso);
            nodoSilencioso.connect(audioCtx.destination);

            audioProcessor.onaudioprocess = (evento) => {
                const dados = evento.inputBuffer.getChannelData(0);
                for (let i = 0; i < dados.length; i++) bufferAudioAcumulado.push(dados[i]);

                const amostrasNecessarias = audioCtx.sampleRate; // ~1 segundo de áudio
                if (bufferAudioAcumulado.length >= amostrasNecessarias) {
                    const trecho = bufferAudioAcumulado.splice(0, amostrasNecessarias);
                    const agora = Date.now();
                    if (agora - ultimaAnaliseAudio >= INTERVALO_ANALISE_AUDIO_MS) {
                        ultimaAnaliseAudio = agora;
                        analisarTrechoDeAudio(trecho, audioCtx.sampleRate);
                    }
                }
            };
        }

        // Reduz a taxa de amostragem para 16kHz, que é o que o modelo espera
        function reamostrarPara16k(amostras, taxaOriginal) {
            if (taxaOriginal === 16000) return amostras;
            const razao = taxaOriginal / 16000;
            const tamanhoNovo = Math.floor(amostras.length / razao);
            const resultado = new Float32Array(tamanhoNovo);
            for (let i = 0; i < tamanhoNovo; i++) {
                resultado[i] = amostras[Math.floor(i * razao)];
            }
            return resultado;
        }

        function calcularVolumeRMS(amostras) {
            let soma = 0;
            for (let i = 0; i < amostras.length; i++) soma += amostras[i] * amostras[i];
            return Math.sqrt(soma / amostras.length);
        }

        async function analisarTrechoDeAudio(amostrasOriginais, taxaOriginal) {
            if (!modeloAudio) return;
            const amostras16k = reamostrarPara16k(amostrasOriginais, taxaOriginal);
            const volume = calcularVolumeRMS(amostras16k);

            try {
                const entrada = tf.tensor1d(amostras16k);
                const saida = modeloAudio.predict(entrada);
                const listaSaida = Array.isArray(saida) ? saida : [saida];
                const pontuacoesPorQuadro = listaSaida[0];
                const media = pontuacoesPorQuadro.mean(0);
                const valores = await media.data();

                tf.dispose(entrada);
                tf.dispose(listaSaida);
                tf.dispose(media);

                let categoriaDetectada = null;
                let melhorPontuacao = 0;

                CATEGORIAS_AUDIO.forEach(categoria => {
                    const indice = indicesCategorias[categoria.chave];
                    if (indice >= 0 && valores[indice] > LIMIAR_CLASSE_AUDIO && valores[indice] > melhorPontuacao) {
                        categoriaDetectada = categoria;
                        melhorPontuacao = valores[indice];
                    }
                });

                if (categoriaDetectada) {
                    dispararAlertaDeAudio(categoriaDetectada.label, categoriaDetectada.tag);
                } else if (volume > LIMIAR_SOM_ALTO) {
                    dispararAlertaDeAudio('Som alto não identificado', 'loud_sound');
                }
            } catch (e) {
                console.log('Erro ao analisar áudio:', e);
            }
        }

        function dispararAlertaDeAudio(rotulo, tagIcone) {
            tempoUltimoMovimento = Date.now();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ id: nomeDaCamera, tipo: 'ALERTA', origem: 'audio', dados: `SOM DETECTADO: ${rotulo}` }));
            }
            if (!gravando && gravador && gravador.state === "inactive") {
                gravando = true;
                pedacosVideo = [];
                gravador.start();
                atualizarStatus("alerta", `GRAVANDO: ${rotulo.toUpperCase()}`);
                fetch("https://ntfy.sh/" + NTFY_TOPICO, {
                    method: "POST",
                    headers: { "Title": "Alerta de Som", "Tags": tagIcone || "loud_sound" },
                    body: `Alerta de som: ${rotulo} detectado na câmera!`
                });
            }
        }

        function enviarInformacoesAmbiente() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (posicao) => {
                    const lat = posicao.coords.latitude; const lon = posicao.coords.longitude;
                    try {
                        const resGeo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const dadosGeo = await resGeo.json();
                        const resTemp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);
                        const dadosTemp = await resTemp.json();
                        const temperatura = dadosTemp.current ? dadosTemp.current.temperature_2m + "°C" : "";
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ id: nomeDaCamera, tipo: 'GEO', dados: dadosGeo.address.city + " - " + (dadosGeo.address.state || "") + " (" + temperatura + ")" }));
                        }
                    } catch(e) {}
                });
            }
        }

        function conectarWebsocket() {
            // Conexão direta com o seu servidor no Render, autenticada com a chave de dispositivo
            ws = new WebSocket("wss://testejr.onrender.com/ws?token=" + encodeURIComponent(CHAVE_DISPOSITIVO));

            ws.onopen = () => {
                enviarInformacoesAmbiente();
                if(loopTransmissao) clearInterval(loopTransmissao);
                loopTransmissao = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN && videoElem.videoWidth > 0) {
                        try {
                            ctxStream.drawImage(videoElem, 0, 0, canvasStream.width, canvasStream.height);
                            const foto = canvasStream.toDataURL('image/jpeg', 0.4); 
                            ws.send(JSON.stringify({ id: nomeDaCamera, tipo: 'FRAME', dados: foto }));
                        } catch (e) { }
                    }
                }, 250);
            };

            ws.onmessage = (evento) => {
                try {
                    const pacote = JSON.parse(evento.data);
                    // Recebe o áudio do Monitor e toca na câmera
                    if (pacote.tipo === 'AUDIO' && (pacote.alvo === nomeDaCamera || pacote.alvo === 'TODOS')) {
                        const som = new Audio(pacote.dados);
                        som.play();
                    }
                } catch(e) {}
            };

            ws.onclose = () => {
                if(loopTransmissao) clearInterval(loopTransmissao);
                setTimeout(conectarWebsocket, 3000);
            };
        }

        async function iniciarCameraLocal() {
            try {
                // Pede permissão para acessar a câmera e o microfone
                streamAtual = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoElem.srcObject = streamAtual;
                
                videoElem.onloadedmetadata = () => {
                    canvasIA.width = videoElem.videoWidth;
                    canvasIA.height = videoElem.videoHeight;
                };

                // Configura o gravador de vídeo nativo
                gravador = new MediaRecorder(streamAtual, { mimeType: 'video/webm' });
                
                gravador.ondataavailable = (e) => { if (e.data.size > 0) pedacosVideo.push(e.data); };
                gravador.onstop = async () => {
                    const blob = new Blob(pedacosVideo, { type: 'video/webm' });
                    pedacosVideo = [];
                    const pacote = new FormData();
                    pacote.append("video", blob, "alerta_baba_" + Date.now() + ".webm");
                    
                    // Envia para o Render salvar no Google Drive, autenticado com a chave de dispositivo
                    fetch("https://testejr.onrender.com/alerta_movimento?token=" + encodeURIComponent(CHAVE_DISPOSITIVO), { method: "POST", body: pacote });
                };

                fetch("https://ntfy.sh/" + NTFY_TOPICO, { method: "POST", body: `Plataforma Ativada: ${nomeDaCamera} conectada com sucesso.` });
                carregarInteligencia();
                carregarInteligenciaAudio();

            } catch (err) {
                atualizarStatus("alerta", "PERMISSÃO DE CÂMERA NEGADA");
            }
        }

        const INTERVALO_DETECCAO_MS = 300; // Ajuste aqui para controlar o gasto de CPU/bateria

        async function processarVisaoComputacional() {
            if (!modeloIA || videoElem.videoWidth === 0) {
                setTimeout(processarVisaoComputacional, INTERVALO_DETECCAO_MS);
                return;
            }
            
            try {
                const previsoes = await modeloIA.detect(videoElem);
                ctxIA.clearRect(0, 0, canvasIA.width, canvasIA.height);
                
                let ameacaDetectada = false;
                let nomeAmeaca = "";

                previsoes.forEach(previsao => {
                    if (alvos.includes(previsao.class) && previsao.score > 0.60) {
                        ameacaDetectada = true;
                        nomeAmeaca = previsao.class === 'person' ? 'PESSOA' : 'ANIMAL';
                        
                        ctxIA.beginPath();
                        ctxIA.rect(...previsao.bbox);
                        ctxIA.lineWidth = 4;
                        ctxIA.strokeStyle = '#ff453a';
                        ctxIA.fillStyle = '#ff453a';
                        ctxIA.stroke();
                        ctxIA.fillText(nomeAmeaca + " (" + Math.round(previsao.score * 100) + "%)", previsao.bbox[0], previsao.bbox[1] > 10 ? previsao.bbox[1] - 5 : 10);
                    }
                });

                if (ameacaDetectada) {
                    tempoUltimoMovimento = Date.now();
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ id: nomeDaCamera, tipo: 'ALERTA', origem: 'video', dados: `IA DETECTOU: ${nomeAmeaca}` }));
                    }
                    if (!gravando && gravador.state === "inactive") {
                        gravando = true;
                        pedacosVideo = [];
                        gravador.start();
                        atualizarStatus("alerta", `GRAVANDO: ${nomeAmeaca} DETECTADO`);
                        
                        // Notificação Push no celular via Ntfy
                        fetch("https://ntfy.sh/" + NTFY_TOPICO, {
                            method: "POST",
                            headers: { "Title": "Alerta de Vigilância", "Tags": "camera" },
                            body: `Alerta do Monitor: ${nomeAmeaca} detectado na câmera!`
                        });
                    }
                }

                if (gravando && (Date.now() - tempoUltimoMovimento > 5000)) {
                    gravador.stop();
                    gravando = false;
                    ctxIA.clearRect(0, 0, canvasIA.width, canvasIA.height);
                    atualizarStatus("seguro", "SISTEMA ONLINE E VIGIANDO");
                }
            } catch (e) {}

            setTimeout(processarVisaoComputacional, INTERVALO_DETECCAO_MS);
        }
    </script>
</body>
</html>
