<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera da Babá</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; 
            background-color: #000000; 
            background-image: radial-gradient(circle at 50% 0%, #1a1a1c 0%, #000000 80%);
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            text-align: center; 
            max-width: 600px; 
            width: 100%; 
            box-sizing: border-box;
        }
        h2 { 
            font-weight: 600; 
            font-size: 20px; 
            margin: 0 0 20px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            letter-spacing: 0.5px;
        }
        svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        video { 
            width: 100%; 
            border-radius: 16px; 
            background: #0a0a0a; 
            margin-bottom: 20px; 
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        canvas { display: none; }
        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: 600; 
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .seguro .dot { background: #32d74b; box-shadow: 0 0 10px #32d74b; }
        .alerta { background: rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.3); color: #ff453a; }
        .alerta .dot { background: #ff453a; box-shadow: 0 0 10px #ff453a; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h2>
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            Câmera do Quarto
        </h2>
        <video id="video-local" autoplay playsinline muted></video>
        <canvas id="canvas-movimento"></canvas> 
        <div id="status-visual" class="status-badge seguro">
            <div class="dot"></div> <span id="status-texto">INICIANDO SISTEMA...</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-local');
        const canvasMovimento = document.getElementById('canvas-movimento');
        const ctxMovimento = canvasMovimento.getContext('2d', { willReadFrequently: true });
        const statusVisual = document.getElementById('status-visual');
        const statusTexto = document.getElementById('status-texto');

        const canvasStream = document.createElement('canvas');
        const ctxStream = canvasStream.getContext('2d');
        canvasStream.width = 320;
        canvasStream.height = 240;

        let ws;
        let quadroAnterior = null;
        let gravador;
        let pedacosVideo = [];
        let gravando = false;
        let tempoUltimoMovimento = 0;

        function atualizarStatus(tipo, mensagem) {
            statusVisual.className = "status-badge " + tipo;
            statusTexto.innerText = mensagem;
        }

        function conectarWebsocket() {
            const protocolo = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(protocolo + "//" + window.location.host + "/ws");

            ws.onopen = () => {
                atualizarStatus("seguro", "TRANSMITINDO AO VIVO");
                
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN && video.readyState >= 2) {
                        ctxStream.drawImage(video, 0, 0, canvasStream.width, canvasStream.height);
                        const foto = canvasStream.toDataURL('image/jpeg', 0.4); 
                        ws.send(JSON.stringify({ tipo: 'FRAME', dados: foto }));
                    }
                }, 250);
            };
        }

        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;

                gravador = new MediaRecorder(stream, { mimeType: 'video/webm' });
                gravador.ondataavailable = (e) => { if (e.data.size > 0) pedacosVideo.push(e.data); };
                
                gravador.onstop = async () => {
                    const blob = new Blob(pedacosVideo, { type: 'video/webm' });
                    pedacosVideo = [];
                    const pacote = new FormData();
                    pacote.append("video", blob, "alerta_" + Date.now() + ".webm");
                    fetch("/alerta_movimento", { method: "POST", body: pacote });
                };

                video.addEventListener('play', processarMovimento);
            } catch (erro) {
                atualizarStatus("alerta", "ERRO: CÂMERA BLOQUEADA");
            }
        }

        function processarMovimento() {
            if (video.paused || video.ended) return;

            canvasMovimento.width = video.videoWidth;
            canvasMovimento.height = video.videoHeight;
            ctxMovimento.drawImage(video, 0, 0, canvasMovimento.width, canvasMovimento.height);
            const quadroAtual = ctxMovimento.getImageData(0, 0, canvasMovimento.width, canvasMovimento.height);

            if (quadroAnterior) {
                let diferencas = 0;
                for (let i = 0; i < quadroAtual.data.length; i += 4) {
                    const r = Math.abs(quadroAtual.data[i] - quadroAnterior.data[i]);
                    const g = Math.abs(quadroAtual.data[i+1] - quadroAnterior.data[i+1]);
                    const b = Math.abs(quadroAtual.data[i+2] - quadroAnterior.data[i+2]);
                    if (r + g + b > 100) diferencas++;
                }

                if (diferencas > 5000) {
                    tempoUltimoMovimento = Date.now();
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ tipo: 'ALERTA', dados: 'MOVIMENTO_DETECTADO' }));
                    }
                    if (!gravando && gravador.state === "inactive") {
                        gravando = true;
                        pedacosVideo = [];
                        gravador.start();
                        atualizarStatus("alerta", "MOVIMENTO DETECTADO");
                    }
                }
            }

            if (gravando && (Date.now() - tempoUltimoMovimento > 5000)) {
                gravador.stop();
                gravando = false;
                atualizarStatus("seguro", "TRANSMITINDO AO VIVO");
            }

            quadroAnterior = quadroAtual;
            setTimeout(() => requestAnimationFrame(processarMovimento), 250);
        }

        conectarWebsocket();
        iniciarCamera();
    </script>
</body>
</html>
