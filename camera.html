<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera Ativa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        #video-local { width: 100%; max-width: 640px; border-radius: 16px; }
        #canvas-ia { position: absolute; max-width: 640px; z-index: 10; pointer-events: none; }
        .status { margin-top: 20px; padding: 10px 20px; border-radius: 20px; background: #222; }
    </style>
</head>
<body>
    <video id="video-local" autoplay playsinline muted></video>
    <canvas id="canvas-ia"></canvas>
    <div class="status" id="status">Iniciando câmera...</div>

    <script>
        const video = document.getElementById('video-local');
        const canvas = document.getElementById('canvas-ia');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        
        // Identidade da câmera (cada dispositivo que abrir isso será uma câmera nova)
        let camID = localStorage.getItem('camID') || "Cam-" + Math.floor(Math.random()*1000);
        localStorage.setItem('camID', camID);

        // Conexão WebSocket com o Render
        const ws = new WebSocket("wss://testejr.onrender.com/ws");

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                const model = await cocoSsd.load();
                statusDiv.innerText = "IA Ativa - Transmitindo...";
                detectar(model);
            } catch(e) { statusDiv.innerText = "Erro: " + e.message; }
        }

        async function detectar(model) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            predictions.forEach(p => {
                if(p.score > 0.6) {
                    ctx.strokeStyle = '#ff453a';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(...p.bbox);
                    ctx.fillStyle = '#ff453a';
                    ctx.fillText(p.class, p.bbox[0], p.bbox[1] > 10 ? p.bbox[1] - 5 : 10);
                    
                    // Envia alerta para o WebSocket se detectar pessoa
                    if(p.class === 'person' && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ id: camID, tipo: 'ALERTA', dados: 'PESSOA DETECTADA' }));
                    }
                }
            });

            // Envia frames para o monitor
            if(ws.readyState === WebSocket.OPEN) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 320; tempCanvas.height = 240;
                tempCanvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                ws.send(JSON.stringify({ id: camID, tipo: 'FRAME', dados: tempCanvas.toDataURL('image/jpeg', 0.2) }));
            }
            
            requestAnimationFrame(() => detectar(model));
        }

        start();
    </script>
</body>
</html>
