<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor da Babá</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; 
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1c 0%, #000000 80%);
            color: #ffffff;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.8s ease; 
        }
        body.alerta-bg {
            background-image: radial-gradient(circle at 50% 0%, #3a0a0a 0%, #000000 80%);
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 100%; 
            max-width: 600px;
            box-sizing: border-box;
            transition: border-color 0.5s ease;
        }
        .glass-panel.alerta-border {
            border-color: rgba(255, 69, 58, 0.4);
        }
        h2 { 
            font-weight: 600; 
            font-size: 20px; 
            margin: 0 0 20px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            letter-spacing: 0.5px;
        }
        svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        img { 
            width: 100%; 
            border-radius: 16px; 
            background: #0a0a0a; 
            margin-bottom: 20px; 
            min-height: 200px;
            object-fit: cover;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: 600; 
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .seguro .dot { background: #32d74b; box-shadow: 0 0 10px #32d74b; }
        .alerta { background: rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.3); color: #ff453a; }
        .alerta .dot { background: #ff453a; box-shadow: 0 0 10px #ff453a; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="painel-principal" class="glass-panel">
        <h2>
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            Monitor ao Vivo
        </h2>
        <img id="video-ao-vivo" alt="Aguardando transmissão..." />
        <div id="status-visual" class="status-badge alerta">
            <div class="dot"></div> <span id="status-texto">CONECTANDO...</span>
        </div>
    </div>

    <script>
        const painel = document.getElementById('painel-principal');
        const statusVisual = document.getElementById('status-visual');
        const statusTexto = document.getElementById('status-texto');
        const imagemAoVivo = document.getElementById('video-ao-vivo');
        let timeoutAlerta;
        let timeoutConexao;

        function atualizarStatusSeguro() {
            statusVisual.className = "status-badge seguro";
            statusTexto.innerText = "SINAL ESTÁVEL";
            document.body.classList.remove("alerta-bg");
            painel.classList.remove("alerta-border");
        }

        function conectarWebsocket() {
            const protocolo = window.location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(protocolo + "//" + window.location.host + "/ws");

            ws.onmessage = (evento) => {
                try {
                    const pacote = JSON.parse(evento.data);

                    if (pacote.tipo === 'FRAME') {
                        imagemAoVivo.src = pacote.dados;
                        
                        clearTimeout(timeoutConexao);
                        timeoutConexao = setTimeout(() => {
                            if(!statusVisual.classList.contains("alerta")) {
                                statusVisual.className = "status-badge alerta";
                                statusTexto.innerText = "SEM SINAL DA CÂMERA";
                            }
                        }, 2000);
                        
                        if(statusTexto.innerText === "CONECTANDO...") {
                            atualizarStatusSeguro();
                        }
                    } 
                    else if (pacote.tipo === 'ALERTA') {
                        statusVisual.className = "status-badge alerta";
                        statusTexto.innerText = "MOVIMENTO DETECTADO";
                        document.body.classList.add("alerta-bg"); 
                        painel.classList.add("alerta-border");

                        clearTimeout(timeoutAlerta);
                        timeoutAlerta = setTimeout(atualizarStatusSeguro, 5000);
                    }
                } catch (e) {}
            };

            ws.onclose = () => {
                statusVisual.className = "status-badge alerta";
                statusTexto.innerText = "SERVIDOR DESCONECTADO";
                setTimeout(conectarWebsocket, 3000);
            };
        }

        conectarWebsocket();
    </script>
</body>
</html>
