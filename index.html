<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icone.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; background-color: #000000; background-image: radial-gradient(circle at 50% 0%, #1a1a1c 0%, #000000 80%); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        h1 { font-weight: 600; font-size: 24px; margin: 0 0 10px 0; letter-spacing: 0.5px; }
        p { color: #a1a1a6; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; margin-bottom: 15px; box-sizing: border-box; transition: transform 0.2s, opacity 0.2s; border: none; cursor: pointer; }
        .btn:active { transform: scale(0.98); }
        .btn-camera { background: #32d74b; color: #000; }
        .btn-monitor { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>Babá Eletrônica</h1>
        <p>Acompanhe sua residência em tempo real com inteligência artificial e alertas automáticos.</p>
        
        <a href="/camera" class="btn btn-camera">Ativar Câmera Local</a>
        <a href="/monitor" class="btn btn-monitor">Acesso Administrativo</a>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
